name: Windows source build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source-validation:
    runs-on: windows-2025
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          & dotnet restore WorkIntelligence.slnx -p:UseAppHost=false -p:SelfContained=false -p:PublishSingleFile=false 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows source
        shell: pwsh
        run: |
          & dotnet build WorkIntelligence.slnx -c Release --no-restore -p:UseAppHost=false -p:SelfContained=false -p:PublishSingleFile=false 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Automated unit tests
        shell: pwsh
        run: |
          & dotnet test tests/WorkIntelligence.Tests.csproj -c Release --no-build --no-restore -p:UseAppHost=false -p:SelfContained=false -p:PublishSingleFile=false --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore service regression test dependencies
        shell: pwsh
        run: |
          & dotnet restore tests/Core/WorkIntelligence.Core.Tests.csproj 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run encrypted-memory and workspace service regressions
        shell: pwsh
        run: |
          & dotnet test tests/Core/WorkIntelligence.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency security audit
        shell: pwsh
        run: |
          & dotnet list WorkIntelligence/WorkIntelligence.csproj package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wi-windows-build.log" -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release packaging gate
        shell: pwsh
        run: |
          if (Test-Path 'WorkIntelligence/Resources/runtime.zip') {
            Write-Host 'Native runtime available; Windows release packaging may be run separately.'
          } else {
            Write-Host 'SOURCE BUILD ONLY: no native llama/restic bundle; not a user-ready release.'
          }
      - name: Report filtered Windows failure diagnostics
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'wi-windows-build.log'
          $errors = @()
          if (Test-Path $log) {
            $errors = @(Get-Content $log | Where-Object { $_ -match '(: error |error [A-Z]+[0-9]+|Failed!|exception|\bNU[0-9]+\b|\bCS[0-9]+\b)' } | Select-Object -Last 35 | ForEach-Object { $_.Substring(0, [Math]::Min($_.Length, 500)) })
          }
          if ($errors.Count -eq 0) { $errors = @('No matching compiler/test diagnostics captured. Inspect the job logs.') }
          $link = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $body = @("Automated diagnostic report for Windows validation.", "", "Commit: " + $env:GITHUB_SHA, "Run: " + $link, "", "```text") + $errors + @("```", "", "This report is not proof that a release is complete.")
          $bodyFile = Join-Path $env:RUNNER_TEMP 'wi-failure-issue.md'
          $body | Set-Content -Path $bodyFile -Encoding utf8
          gh issue create --repo $env:GITHUB_REPOSITORY --title "Windows CI failure $short (run $env:GITHUB_RUN_ID)" --body-file $bodyFile
  linux-service-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native test build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential tcl libssl-dev python3-venv
      - name: Prepare pinned development tools
        run: bash scripts/setup-linux-tests.sh
      - name: Compile source and execute real storage and recovery regressions
        run: bash scripts/validate-source.sh
