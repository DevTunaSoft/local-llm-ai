name: Windows WPF UI launch smoke test
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  launch-ui:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build source-only WPF application
        shell: pwsh
        run: |
          dotnet build WorkIntelligence/WorkIntelligence.csproj -c Release -p:UseAppHost=false -p:SelfContained=false -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch the actual WPF workspace window and verify it remains alive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WORKINTELLIGENCE_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'wi-ui-test-vault'
          $dll = Join-Path $PWD 'WorkIntelligence/bin/Release/net10.0-windows/win-x64/WorkIntelligence.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "Compiled WPF DLL missing: $dll" }
          $stdout = Join-Path $env:RUNNER_TEMP 'wi-ui-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'wi-ui-stderr.txt'
          $process = Start-Process -FilePath 'dotnet' -ArgumentList @($dll, '--data-root', $env:WORKINTELLIGENCE_DATA_ROOT, '--skip-setup') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $seenWindow = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "WPF process exited during startup with code $($process.ExitCode)." }
              if ($process.MainWindowTitle -eq 'Work Intelligence AI') { $seenWindow = $true; break }
            }
            if (-not $seenWindow) { throw 'WPF process is alive but no Work Intelligence AI window appeared in the Windows session.' }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
            $approvalCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'WorkAuthorizationCheck')
            $approval = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $approvalCondition)
            if (-not $approval) { throw 'Organizational authorization checkbox is missing.' }
            $toggle = [System.Windows.Automation.TogglePattern]$approval.GetCurrentPattern(
              [System.Windows.Automation.TogglePattern]::Pattern)
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Open Local Workspace')
            $button = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if (-not $button) { throw 'Actual Open Local Workspace button is not discoverable through Windows UI Automation.' }
            $invoke = [System.Windows.Automation.InvokePattern]$button.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            if ($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::Off) { throw 'Authorization checkbox must default to unchecked.' }
            $invoke.Invoke()
            $refusalCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Confirm organizational authorization before opening work data.')
            if (-not $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $refusalCondition)) {
              throw 'Unauthorized workspace opening did not show refusal state.'
            }
            $setupCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'First-run Setup')
            $setupButton = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $setupCondition)
            if (-not $setupButton) { throw 'First-run setup action is missing.' }
            ([System.Windows.Automation.InvokePattern]$setupButton.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $setup = $null
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 300
              $setup = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $setupCondition)
              if ($setup) { break }
            }
            if (-not $setup) { throw 'Actual setup wizard did not appear.' }
            $finishCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'SetupFinish')
            $finish = $setup.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $finishCondition)
            ([System.Windows.Automation.InvokePattern]$finish.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            Start-Sleep -Milliseconds 300
            $approvalCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'SetupAuthorization')
            $approval = $setup.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $approvalCondition)
            if (-not $approval) { throw 'Setup did not require explicit authorization before saving.' }
            $setupToggle = [System.Windows.Automation.TogglePattern]$approval.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
            if ($setupToggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::Off) { throw 'Setup authorization must default to unchecked.' }
            $setupToggle.Toggle()
            ([System.Windows.Automation.InvokePattern]$finish.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            for ($attempt=0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 300
              if (Test-Path (Join-Path $env:WORKINTELLIGENCE_DATA_ROOT 'Data/workspace-preferences.json')) { break }
            }
            $preferences = Get-Content (Join-Path $env:WORKINTELLIGENCE_DATA_ROOT 'Data/workspace-preferences.json') -Raw | ConvertFrom-Json
            if (-not $preferences.SetupCompleted) { throw 'Actual setup did not persist completion.' }
            if ($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On) { throw 'Completed setup did not carry explicit consent to the workspace screen.' }
            Write-Host 'Actual first-run wizard refused missing consent, saved preferences and completed.'
            $invoke.Invoke()
            $chatCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'AI Chat')
            $workspaceOpened = $false
            for ($j=0; $j -lt 40; $j++) {
              Start-Sleep -Milliseconds 500
              $tab = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $chatCondition)
              if ($tab -and -not $tab.Current.IsOffscreen) { $workspaceOpened = $true; break }
              $process.Refresh()
              if ($process.HasExited) { throw 'App exited while opening local workspace.' }
            }
            if (-not $workspaceOpened) { throw 'Local workspace failed to show AI Chat after Open Local Workspace was invoked.' }
            Write-Host 'Windows UI Automation opened a synthetic local workspace and found the AI Chat tab.'
            $newChatCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'New Chat')
            $newChat = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $newChatCondition)
            if (-not $newChat) { throw 'New Chat button is not visible in the actual UI.' }
            $newChatPattern = [System.Windows.Automation.InvokePattern]$newChat.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $newChatPattern.Invoke()
            $conversationCreated = $false
            $createdCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Conversation created.')
            for ($k=0; $k -lt 30; $k++) {
              Start-Sleep -Milliseconds 500
              $createdText = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $createdCondition)
              if ($createdText -and -not $createdText.Current.IsOffscreen) { $conversationCreated = $true; break }
              $process.Refresh()
              if ($process.HasExited) { throw 'WPF process exited after New Chat was invoked.' }
            }
            if (-not $conversationCreated) { throw 'New Chat did not show its success status in the real UI.' }
            Write-Host 'Actual New Chat button executed and showed conversation-created status.'
            $titleCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'ChatTitleInput')
            $titleBox = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $titleCondition)
            if (-not $titleBox) { throw 'Rename title field is not accessible in the UI.' }
            $titleValue = [System.Windows.Automation.ValuePattern]$titleBox.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)
            $titleValue.SetValue('Renamed CI chat')
            $renameCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Rename Chat')
            $renameButton = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $renameCondition)
            if (-not $renameButton) { throw 'Rename Chat button is missing.' }
            $renamePattern = [System.Windows.Automation.InvokePattern]$renameButton.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $renamePattern.Invoke()
            $renamedCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Conversation renamed and saved.')
            $renamed = $false
            for ($m=0; $m -lt 30; $m++) {
              Start-Sleep -Milliseconds 500
              $result = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $renamedCondition)
              if ($result) { $renamed = $true; break }
            }
            if (-not $renamed) { throw 'Rename Chat click did not persist the conversation title.' }
            Write-Host 'Actual Rename Chat UI successfully updated the conversation title.'
            $searchCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'ChatSearchInput')
            $searchInput = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $searchCondition)
            if (-not $searchInput) { throw 'Chat search field is missing.' }
            $searchValue = [System.Windows.Automation.ValuePattern]$searchInput.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)
            $searchValue.SetValue('Renamed CI chat')
            $searchButtonCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Search Chats')
            $searchButton = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $searchButtonCondition)
            if (-not $searchButton) { throw 'Search Chats button missing.' }
            $searchPattern = [System.Windows.Automation.InvokePattern]$searchButton.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $searchPattern.Invoke()
            $searchedCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Conversation search complete.')
            $searched = $false
            for ($n=0; $n -lt 30; $n++) {
              Start-Sleep -Milliseconds 500
              if ($window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $searchedCondition)) { $searched = $true; break }
            }
            if (-not $searched) { throw 'Actual chat search did not report completion.' }
            Write-Host 'Actual Search Chats UI successfully executed.'
            function Find-Control([string]$id) {
              $condition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::AutomationIdProperty, $id)
              $control = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
              if (-not $control) { throw "Missing actual WPF control: $id" }
              return $control
            }
            function Set-Text([string]$id, [string]$value) {
              $control = Find-Control $id
              ([System.Windows.Automation.ValuePattern]$control.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)).SetValue($value)
            }
            function Invoke-Named([string]$name) {
              $condition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty, $name)
              $control = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
              if (-not $control) { throw "Missing actual WPF action: $name" }
              ([System.Windows.Automation.InvokePattern]$control.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            }
            $recordTabCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Project Records')
            $recordTab = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $recordTabCondition)
            if (-not $recordTab) { throw 'Project Records tab is missing.' }
            ([System.Windows.Automation.SelectionItemPattern]$recordTab.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern)).Select()
            Set-Text 'WorkTitleInput' 'Synthetic CI project'
            Set-Text 'WorkDetailsInput' 'Original synthetic project details'
            Set-Text 'WorkOwnerInput' 'Synthetic CI owner'
            Invoke-Named 'Save Record'
            Start-Sleep -Milliseconds 500
            Set-Text 'WorkDetailsInput' 'Updated synthetic resolution'
            Set-Text 'WorkReasonInput' 'Synthetic reviewed revision'
            Invoke-Named 'Save Record'
            Start-Sleep -Milliseconds 500
            Invoke-Named 'Revision History'
            Start-Sleep -Milliseconds 500
            $draft = Find-Control 'DocumentDraftInput'
            $history = ([System.Windows.Automation.ValuePattern]$draft.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)).Current.Value
            foreach ($expected in @('Revision 1', 'Original synthetic project details', 'Revision 2', 'Updated synthetic resolution', 'Synthetic reviewed revision', 'Synthetic CI owner')) {
              if (-not $history.Contains($expected)) { throw "Work record UI did not preserve history field: $expected" }
            }
            Write-Host 'Actual project-record creation, owner, revision, and full history display verified.'

            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw 'WPF process crashed after its window appeared.' }
            Write-Host 'Real WPF MainWindow launched and remained running for three seconds.'
          }
          catch {
            $safeMessage = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error::WPF acceptance failure: $safeMessage"
            throw
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stderr) {
              Get-Content $stderr | Select-Object -Last 20 | ForEach-Object { Write-Host 'WPF stderr: [redacted]' }
            }
          }
      - name: Verify New Chat persisted in actual SQLite vault
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WORKINTELLIGENCE_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'wi-ui-test-vault'
          $code = @'
          import os, sqlite3
          from pathlib import Path
          vault = Path(os.environ["WORKINTELLIGENCE_DATA_ROOT"])
          databases = list(vault.rglob("knowledge.db"))
          if len(databases) != 1:
              raise RuntimeError(f"Expected one local SQLite database, found {len(databases)}")
          with sqlite3.connect(f"file:{databases[0].as_posix()}?mode=ro", uri=True) as connection:
              chats = connection.execute("SELECT title FROM chats WHERE title = 'Renamed CI chat'").fetchall()
              if len(chats) != 1:
                  raise RuntimeError(f"New Chat UI did not persist exactly one conversation: {len(chats)}")
              result = connection.execute("PRAGMA integrity_check").fetchone()
              if result != ('ok',):
                  raise RuntimeError("Local SQLite data failed integrity check")
          print("GUI-created chat persisted in valid local SQLite storage.")
          '@
          $code | python -
          if ($LASTEXITCODE -ne 0) { throw 'WPF chat persistence verification failed.' }
      - name: Scope reminder
        if: always()
        shell: pwsh
        run: |
          Write-Host 'UI smoke test is a source DLL launch, not EXE packaging or end-to-end GUI acceptance.'
          Write-Host 'It clicks the local workspace control, but does not exercise model downloads, chat generation, or second-machine restore.'
