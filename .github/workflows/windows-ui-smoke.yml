name: Windows WPF UI launch smoke test
on:
  push:
    paths:
      - '.github/workflows/windows-ui-smoke.yml'
      - 'WorkIntelligence/App.xaml.cs'
      - 'WorkIntelligence/MainWindow.xaml'
      - 'WorkIntelligence/MainWindow.xaml.cs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-ui:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build source-only WPF application
        shell: pwsh
        run: |
          dotnet build WorkIntelligence/WorkIntelligence.csproj -c Release -p:UseAppHost=false -p:SelfContained=false -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch the actual WPF workspace window and verify it remains alive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $PWD 'WorkIntelligence/bin/Release/net10.0-windows/win-x64/WorkIntelligence.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "Compiled WPF DLL missing: $dll" }
          $stdout = Join-Path $env:RUNNER_TEMP 'wi-ui-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'wi-ui-stderr.txt'
          $process = Start-Process -FilePath 'dotnet' -ArgumentList @($dll) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $seenWindow = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "WPF process exited during startup with code $($process.ExitCode)." }
              if ($process.MainWindowTitle -eq 'Work Intelligence AI') { $seenWindow = $true; break }
            }
            if (-not $seenWindow) { throw 'WPF process is alive but no Work Intelligence AI window appeared in the Windows session.' }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Open Local Workspace')
            $button = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if (-not $button) { throw 'Actual Open Local Workspace button is not discoverable through Windows UI Automation.' }
            $invoke = [System.Windows.Automation.InvokePattern]$button.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $invoke.Invoke()
            $chatCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'AI Chat')
            $workspaceOpened = $false
            for ($j=0; $j -lt 40; $j++) {
              Start-Sleep -Milliseconds 500
              $tab = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $chatCondition)
              if ($tab -and -not $tab.Current.IsOffscreen) { $workspaceOpened = $true; break }
              $process.Refresh()
              if ($process.HasExited) { throw 'App exited while opening local workspace.' }
            }
            if (-not $workspaceOpened) { throw 'Local workspace failed to show AI Chat after Open Local Workspace was invoked.' }
            Write-Host 'Windows UI Automation opened a synthetic local workspace and found the AI Chat tab.'
            $newChatCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'New Chat')
            $newChat = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $newChatCondition)
            if (-not $newChat) { throw 'New Chat button is not visible in the actual UI.' }
            $newChatPattern = [System.Windows.Automation.InvokePattern]$newChat.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $newChatPattern.Invoke()
            $conversationCreated = $false
            $createdCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Conversation created.')
            for ($k=0; $k -lt 30; $k++) {
              Start-Sleep -Milliseconds 500
              $createdText = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $createdCondition)
              if ($createdText -and -not $createdText.Current.IsOffscreen) { $conversationCreated = $true; break }
              $process.Refresh()
              if ($process.HasExited) { throw 'WPF process exited after New Chat was invoked.' }
            }
            if (-not $conversationCreated) { throw 'New Chat did not show its success status in the real UI.' }
            Write-Host 'Actual New Chat button executed and showed conversation-created status.'
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw 'WPF process crashed after its window appeared.' }
            Write-Host 'Real WPF MainWindow launched and remained running for three seconds.'
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stderr) {
              Get-Content $stderr | Select-Object -Last 20 | ForEach-Object { Write-Host 'WPF stderr: [redacted]' }
            }
          }
      - name: Scope reminder
        if: always()
        shell: pwsh
        run: |
          Write-Host 'UI smoke test is a source DLL launch, not EXE packaging or end-to-end GUI acceptance.'
          Write-Host 'It clicks the local workspace control, but does not exercise model downloads, chat generation, or second-machine restore.'
