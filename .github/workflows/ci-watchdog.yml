name: Work Intelligence CI watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: work-intelligence-ci-watchdog
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check latest source validation and report failures
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'windows-build.yml';
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: 'main', per_page: 30
            });
            // Ignore this watchdog's own runs. Inspect the latest source-validation run.
            const run = data.workflow_runs[0];
            if (!run) {
              core.setFailed('No source validation runs found on main.');
              return;
            }
            const now = Date.now();
            const ageMinutes = (now - Date.parse(run.created_at)) / 60000;
            const durationMinutes = (now - Date.parse(run.run_started_at || run.created_at)) / 60000;
            const bad = run.status === 'completed' && run.conclusion !== 'success';
            const stalled = run.status !== 'completed' && durationMinutes > 60;
            core.info(`Latest source validation: ${run.html_url}; status=${run.status}; conclusion=${run.conclusion}; age=${Math.round(ageMinutes)}m`);
            if (!bad && !stalled) return;
            const kind = bad ? 'failed' : 'stalled';
            const marker = '<!-- wi-ci-watchdog -->';
            const title = 'Work Intelligence source validation requires attention';
            const body = [
              marker,
              'Automated five-minute CI watchdog detected a ' + kind + ' source-validation run.',
              '',
              '- Run: ' + run.html_url,
              '- Commit: `' + run.head_sha + '`',
              '- Status: `' + run.status + '`',
              '- Conclusion: `' + (run.conclusion || 'pending') + '`',
              '- Runtime: ' + Math.round(durationMinutes) + ' minutes',
              '',
              'This monitor checks GitHub CI only. It cannot prove that the separate hourly development automation is actively coding.'
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              core.warning('Updated existing watchdog issue #' + existing.number);
            } else {
              const created = await github.rest.issues.create({owner, repo, title, body, labels: []});
              core.warning('Created watchdog issue #' + created.data.number);
            }
            core.setFailed('Source validation ' + kind + ': ' + run.html_url);
