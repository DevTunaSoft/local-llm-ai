name: Work Intelligence consolidated Windows acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-qa.yml'
      - 'WorkIntelligence/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/handoff/requirements.json'
      - 'docs/handoff/requirement-evidence.json'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/windows-ui-smoke.yml'
      - '.github/workflows/live-inference-smoke.yml'
permissions:
  contents: read
  issues: write
jobs:
  requirement-traceability:
    name: Validate all 106 requirements and acceptance evidence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify requirement IDs, coverage, and evidence integrity
        run: |
          python3 scripts/verify-requirements.py
          python3 -m unittest discover -s tests/python
  source-and-storage:
    name: Compile, source tests, storage, backup and Linux regression
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read
      issues: write
  actual-windows-ui:
    name: Launch WPF, create, rename and search persisted conversations
    uses: ./.github/workflows/windows-ui-smoke.yml
    permissions:
      contents: read
  actual-offline-models:
    name: Run local GGUF chat, restarts, embeddings and vector retrieval
    uses: ./.github/workflows/live-inference-smoke.yml
    permissions:
      contents: read
